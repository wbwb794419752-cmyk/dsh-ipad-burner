name: Build unsigned IPA

# 触发方式：推送到 main/master，或在 Actions 页面手动 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: xcodegen + xcodebuild archive (unsigned)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Show Xcode version
        run: |
          xcodebuild -version
          uname -m
          sysctl -n machdep.cpu.brand_string || true

      # ANE 模型必须在 xcodegen 之前生成：xcodegen 扫描 Burner/ 目录时才看得到
      # Burner/Resources/ane_burner.mlmodel，并把它作为资源加进工程。
      # 模型本身不进 git（.gitignore 里排除了 *.mlmodel）。
      # 固定用 Python 3.12：coremltools 只有到 cp313 的 arm64 wheel，
      # runner 自带的 python3 是 3.15，只能拿 sdist 编译（没有 libcoremlpython，
      # 也就没法用 MLComputePlan 验证 ANE 路由）。
      - name: Set up Python (Core ML wheels)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ANE Core ML model
        run: |
          set -euo pipefail
          python -m venv .venv-coreml
          .venv-coreml/bin/python -m pip install --upgrade pip
          .venv-coreml/bin/python -m pip install "coremltools>=8,<10" numpy
          .venv-coreml/bin/python -c "import coremltools; print('coremltools', coremltools.__version__)"
          mkdir -p Burner/Resources
          # --verify：在 macOS runner 上编译模型并用 MLComputePlan 打印每层落在哪个计算单元，
          # 用来确认算子真的路由到 Neural Engine（日志里看 "ANE 路由" 那几行）。
          .venv-coreml/bin/python generate_ane_model.py \
            --out Burner/Resources/ane_burner.mlmodel --verify
          ls -la Burner/Resources/

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          ls -la Burner.xcodeproj
          # 确认 .mlmodel 被写进了工程文件（Resource 阶段）
          grep -c "ane_burner.mlmodel" Burner.xcodeproj/project.pbxproj || true

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Burner.xcodeproj \
            -scheme Burner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Burner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Burner.xcarchive/Products/Applications/Burner.app"
          echo "--- archive 内容 ---"
          ls -la build/Burner.xcarchive/Products/Applications/ || true
          test -d "$APP" || { echo "找不到 $APP"; exit 1; }

          rm -rf Payload Burner-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 未签名包不需要（也不该有）签名残留
          rm -rf Payload/Burner.app/_CodeSignature
          rm -rf Payload/Burner.app/embedded.mobileprovision

          # ANE 模型必须真的编译进了 bundle（.mlmodel → .mlmodelc）
          echo "--- Core ML 资源 ---"
          ls -la Payload/Burner.app | grep -i "mlmodel" || echo "警告: bundle 里没有 ane_burner.mlmodelc"

          zip -qry Burner-unsigned.ipa Payload
          echo "--- 产物 ---"
          ls -lh Burner-unsigned.ipa
          unzip -l Burner-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Burner-unsigned-ipa
          path: Burner-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: warn
