# ============================================================================
#  iPad Burner — XcodeGen 工程描述
#  用 `xcodegen generate` 生成 Burner.xcodeproj（不手写 pbxproj）
#  目标：iOS 17.0+ / arm64 / 未签名可归档
# ============================================================================
name: Burner

options:
  bundleIdPrefix: com.dsh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.35.0"

# 全工程共享的编译设置
settings:
  base:
    SWIFT_VERSION: "5.0"                 # Swift 5 语言模式（避免 Swift 6 严格并发报错）
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 未签名构建：不参与任何描述文件解析（GHA 里也会再传一遍命令行参数兜底）
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Burner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # 源码目录：Swift + Metal + Assets 全部在 Burner/ 下
    sources:
      - path: Burner

    # Info.plist 由 XcodeGen 生成（放在工程根目录，避免被当成资源打进 bundle）
    info:
      path: Burner-Info.plist
      properties:
        CFBundleDisplayName: 烧机
        CFBundleName: Burner
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        # 全屏常驻：关掉 iPad 分屏/台前调度，避免窗口被缩小
        UIRequiresFullScreen: true
        # 隐藏状态栏，屏幕尽量纯白
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # 空字典 = 纯白 LaunchScreen（iOS 14+ 的 UILaunchScreen 方案）
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSHighResolutionCapable: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsh.ipadburner
        PRODUCT_NAME: Burner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"     # 1=iPhone 2=iPad（主要给 iPad Pro 11 M1）
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Burner-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Release 优化：Swift 全模块 -O，Metal 开 fast-math（更快、更热）
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        MTL_FAST_MATH: YES
        MTL_ENABLE_DEBUG_INFO: NO
        GCC_OPTIMIZATION_LEVEL: "-O3"
        ONLY_ACTIVE_ARCH: NO
        VALIDATE_PRODUCT: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_MODULE_VERIFIER: NO
        DEAD_CODE_STRIPPING: YES

    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework

# 显式声明 scheme，保证 `xcodebuild -scheme Burner` 一定能找到
schemes:
  Burner:
    build:
      targets:
        Burner: all
    run:
      config: Release
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
